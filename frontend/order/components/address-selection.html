<section
    class="order-address-selection"
    aria-labelledby="order-address-selection-title"
>

    <div class="order-address-header">

        <p class="order-address-eyebrow">
            Delivery
        </p>

        <h2 id="order-address-selection-title">
            Select Delivery Address
        </h2>

        <p class="order-address-description">
            Choose the saved address where this order should be delivered.
        </p>

    </div>


    <div
        id="order-address-list"
        class="order-address-list"
    >
        <p class="order-address-message">
            Loading your saved addresses...
        </p>
    </div>


    <p
        id="order-address-selection-message"
        class="order-address-selection-message"
        role="status"
    ></p>


    <button
        type="button"
        id="confirm-order-address-button"
        class="order-address-confirm-button"
        disabled
    >
        Continue
    </button>

</section>
