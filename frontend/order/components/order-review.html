<section
    class="order-review"
    aria-labelledby="order-review-title"
>
    <div class="order-review-header">
        <p class="order-review-eyebrow">
            Review
        </p>

        <h2 id="order-review-title">
            Review Your Order
        </h2>

        <p class="order-review-description">
            Check your order details before placing the order.
        </p>
    </div>


    <div
        id="order-review-content"
        class="order-review-content"
    >
        <p class="order-review-message">
            Preparing your order review...
        </p>
    </div>


    <div
        id="order-review-message"
        class="order-review-message"
        role="status"
    ></div>


    <button
        type="button"
        id="place-order-button"
        class="place-order-button"
        disabled
    >
        Place Order
    </button>
</section>
