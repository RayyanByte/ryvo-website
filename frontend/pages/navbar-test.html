<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Navbar Test</title>

    <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>

    <div id="navbar-container"></div>

    <main>
        <h1>Navbar Test Page</h1>
        <p>
            Agar Navbar upar properly dikh raha hai,
            to HTML aur CSS load ho rahe hain.
        </p>
    </main>

    <script>
        fetch("../components/navbar.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        "Navbar file load nahi hui."
                    );
                }

                return response.text();
            })
            .then(html => {
                document.getElementById(
                    "navbar-container"
                ).innerHTML = html;
            })
            .catch(error => {
                document.getElementById(
                    "navbar-container"
                ).innerHTML =
                    "<p>Navbar load error: " +
                    error.message +
                    "</p>";
            });
    </script>

</body>
</html>
