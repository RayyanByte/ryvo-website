<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Food</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/hero.css">
    <link rel="stylesheet" href="../css/featured-food.css">
    <link rel="stylesheet" href="../css/categories.css">
    <link rel="stylesheet" href="../css/our-story.css">
    <link rel="stylesheet" href="../css/testimonials.css">
    <link rel="stylesheet" href="../css/why-choose-us.css">
    <link rel="stylesheet" href="../css/order-cta.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body>

    <div id="navbar-container"></div>

    <div id="hero-container"></div>

    <div id="featured-food-container"></div>

    <div id="categories-container"></div>

    <div id="our-story-container"></div>

    <div id="testimonials-container"></div>

    <div id="why-choose-us-container"></div>

    <div id="order-cta-container"></div>

    <div id="footer-container"></div>


    <script>
        async function loadComponent(
            containerId,
            componentPath
        ) {
            try {
                const response = await fetch(
                    componentPath
                );

                if (!response.ok) {
                    throw new Error(
                        "Component load failed: " +
                        componentPath
                    );
                }

                const html =
                    await response.text();

                document.getElementById(
                    containerId
                ).innerHTML = html;

            
                if (containerId === "navbar-container") {
                    const loggedIn =
                        !!localStorage.getItem("authToken");

                    const loggedOutActions =
                        document.getElementById("logged-out-actions");

                    const loggedInActions =
                        document.getElementById("logged-in-actions");

                    if (loggedOutActions) {
                        loggedOutActions.hidden = loggedIn;
                    }

                    if (loggedInActions) {
                        loggedInActions.hidden = !loggedIn;
                    }
                }
} catch (error) {
                console.error(error);

                document.getElementById(
                    containerId
                ).innerHTML =
                    "<p>Component load error.</p>";
            }
        }



        function logoutUser(event) {
            event.preventDefault();

            localStorage.removeItem("authToken");
            localStorage.removeItem("userRole");

            window.location.href = "/pages/home.html";
        }

        loadComponent(
            "navbar-container",
            "../components/navbar.html"
        );

        loadComponent(
            "hero-container",
            "../components/hero.html"
        );

        loadComponent(
            "featured-food-container",
            "../components/featured-food.html"
        );

        loadComponent(
            "categories-container",
            "../components/categories.html"
        );

        loadComponent(
            "our-story-container",
            "../components/our-story.html"
        );

        loadComponent(
            "testimonials-container",
            "../components/testimonials.html"
        );

        loadComponent(
            "why-choose-us-container",
            "../components/why-choose-us.html"
        );

        loadComponent(
            "order-cta-container",
            "../components/order-cta.html"
        );

        loadComponent(
            "footer-container",
            "../components/footer.html"
        );
    </script>


<script>
document.addEventListener("click", (event) => {
    const button = event.target.closest(".food-card-button");

    if (!button) {
        return;
    }

    const card = button.closest(".food-card");

    if (!card) {
        return;
    }

    const name =
        card.querySelector(".food-card-title")?.textContent.trim();

    const priceText =
        card.querySelector(".food-card-price")?.textContent.trim() || "";

    const price =
        Number(priceText.replace(/[^0-9.]/g, ""));

    const orderItem = {
        foodId: name,
        name,
        price
    };

    sessionStorage.setItem(
        "ryvo_selected_order_item",
        JSON.stringify(orderItem)
    );

    const token =
        localStorage.getItem("authToken");

    if (!token) {
        window.location.href =
            "/auth/pages/login.html";
        return;
    }

    window.location.href =
        "/delivery/pages/order-location.html";
});
</script>

</body>
</html>
