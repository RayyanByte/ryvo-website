<section
    id="delivery-location-status"
    class="delivery-location-status"
    aria-live="polite"
    hidden
>

    <div
        id="delivery-status-icon"
        class="delivery-status-icon"
        aria-hidden="true"
    >
        📍
    </div>


    <div class="delivery-status-content">

        <p
            id="delivery-status-label"
            class="delivery-status-label"
        >
            Delivery Location
        </p>

        <h2
            id="delivery-status-title"
            class="delivery-status-title"
        >
            Checking delivery availability...
        </h2>

        <p
            id="delivery-status-message"
            class="delivery-status-message"
        ></p>

    </div>


    <button
        type="button"
        id="delivery-status-action"
        class="delivery-status-action"
        hidden
    >
        Continue to Order
    </button>

</section>
