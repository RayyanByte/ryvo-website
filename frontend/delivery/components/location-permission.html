<section
    id="location-permission-prompt"
    class="location-permission-prompt"
    aria-labelledby="location-permission-title"
>

    <div class="location-permission-icon">
        📍
    </div>

    <div class="location-permission-content">

        <p class="location-permission-eyebrow">
            Faster Location
        </p>

        <h2 id="location-permission-title">
            Use your current location?
        </h2>

        <p>
            Allow location access to quickly place the map at your
            current position. You can adjust the exact delivery point
            on the map afterward.
        </p>

    </div>

    <div class="location-permission-actions">

        <button
            type="button"
            id="allow-location-button"
        >
            Allow Location
        </button>

        <button
            type="button"
            id="choose-map-button"
        >
            Choose on Map
        </button>

    </div>

</section>
