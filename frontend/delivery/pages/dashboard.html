<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >
</head>

<body>
    <main class="delivery-dashboard">

        <header class="delivery-header">
            <div>
                <p class="delivery-eyebrow">
                    Delivery Area
                </p>

                <h1>
                    Delivery Dashboard
                </h1>

                <p class="delivery-subtitle">
                    Manage your assigned orders.
                </p>
            </div>
        </header>

        <section
            class="delivery-content"
            aria-label="Delivery orders"
        >
            <div
                id="delivery-orders"
                class="delivery-orders"
            >
                <p class="delivery-message">
                    Loading assigned orders...
                </p>
            </div>
        </section>

    </main>

    <script src="../js/dashboard.js"></script>
</body>
</html>
