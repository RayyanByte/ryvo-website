<section class="admin-section" id="foodDashboard">
    <div class="admin-section-header">
        <div>
            <h2>Food Management</h2>
            <p>Manage menu items, prices, availability and categories.</p>
        </div>

        <button
            type="button"
            id="addFoodButton"
            class="admin-primary-button"
        >
            Add Food
        </button>
    </div>

    <div id="foodDashboardMessage"></div>

    <div
        id="foodFormContainer"
        class="admin-form-container"
        hidden
    >
        <form id="foodForm">
            <input
                type="hidden"
                id="foodId"
            >

            <div class="admin-form-grid">
                <div class="admin-field">
                    <label for="foodName">Name</label>
                    <input
                        id="foodName"
                        type="text"
                        required
                    >
                </div>

                <div class="admin-field">
                    <label for="foodPrice">Price</label>
                    <input
                        id="foodPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="admin-field">
                    <label for="foodCategory">Category</label>
                    <select
                        id="foodCategory"
                        required
                    ></select>
                </div>

                <div class="admin-field">
                    <label for="foodImage">Image URL</label>
                    <input
                        id="foodImage"
                        type="url"
                    >
                </div>

                <div class="admin-field admin-field-full">
                    <label for="foodDescription">Description</label>
                    <textarea
                        id="foodDescription"
                        rows="4"
                    ></textarea>
                </div>

                <div class="admin-field">
                    <label>
                        <input
                            id="foodAvailable"
                            type="checkbox"
                            checked
                        >
                        Available
                    </label>
                </div>

                <div class="admin-field">
                    <label>
                        <input
                            id="foodActive"
                            type="checkbox"
                            checked
                        >
                        Active
                    </label>
                </div>
            </div>

            <div class="admin-form-actions">
                <button
                    type="submit"
                    class="admin-primary-button"
                    id="saveFoodButton"
                >
                    Save Food
                </button>

                <button
                    type="button"
                    class="admin-secondary-button"
                    id="cancelFoodButton"
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>

    <div class="admin-filter-row">
        <select id="foodCategoryFilter">
            <option value="">All Categories</option>
        </select>

        <button
            type="button"
            id="refreshFoodsButton"
            class="admin-secondary-button"
        >
            Refresh
        </button>
    </div>

    <div
        id="foodList"
        class="admin-card-grid"
    ></div>
</section>
