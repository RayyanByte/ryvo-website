<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYVO Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="/admin/css/admin-sidebar.css">
</head>

<body class="admin-body">

<!-- Mobile Hamburger -->
<button
    type="button"
    class="admin-hamburger"
    id="admin-hamburger"
    aria-label="Open menu"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Sidebar Overlay (mobile) -->
<div class="admin-sidebar-overlay" id="admin-sidebar-overlay"></div>

<!-- Sidebar -->
<aside class="admin-sidebar" id="admin-sidebar">

    <div class="admin-sidebar-brand">
        <h1>RYVO</h1>
        <p>Admin Panel</p>
    </div>

    <nav class="admin-sidebar-nav">

        <a href="#" class="admin-nav-item" data-admin-route="dashboard">
            <span class="admin-nav-icon">📊</span>
            <span class="admin-nav-label">Dashboard</span>
        </a>

        <div class="admin-nav-group">

            <button
                type="button"
                class="admin-nav-item admin-nav-parent"
                data-admin-toggle="orders"
            >
                <span class="admin-nav-icon">📦</span>
                <span class="admin-nav-label">Orders</span>
                <span class="admin-nav-arrow">▾</span>
            </button>

            <div class="admin-nav-children" data-admin-children="orders">

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-all">
                    All Orders
                    <span class="admin-nav-badge" data-badge="orders-all" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-pending">
                    New Orders
                    <span class="admin-nav-badge" data-badge="orders-pending" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-confirmed">
                    Confirmed
                    <span class="admin-nav-badge" data-badge="orders-confirmed" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-preparing">
                    Preparing
                    <span class="admin-nav-badge" data-badge="orders-preparing" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-out">
                    Out for Delivery
                    <span class="admin-nav-badge" data-badge="orders-out" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-delivered">
                    Delivered
                    <span class="admin-nav-badge" data-badge="orders-delivered" hidden>0</span>
                </a>

                <a href="#" class="admin-nav-item admin-nav-child" data-admin-route="orders-cancelled">
                    Cancelled
                    <span class="admin-nav-badge" data-badge="orders-cancelled" hidden>0</span>
                </a>

            </div>

        </div>

        <a href="#" class="admin-nav-item" data-admin-route="payments">
            <span class="admin-nav-icon">💳</span>
            <span class="admin-nav-label">Payments</span>
        </a>

        <a href="#" class="admin-nav-item" data-admin-route="delivery">
            <span class="admin-nav-icon">🚚</span>
            <span class="admin-nav-label">Delivery Boys</span>
        </a>

        <a href="#" class="admin-nav-item" data-admin-route="food">
            <span class="admin-nav-icon">🍔</span>
            <span class="admin-nav-label">Food</span>
        </a>

        <a href="#" class="admin-nav-item" data-admin-route="categories">
            <span class="admin-nav-icon">📁</span>
            <span class="admin-nav-label">Categories</span>
        </a>

        <a href="#" class="admin-nav-item" data-admin-route="customers">
            <span class="admin-nav-icon">👥</span>
            <span class="admin-nav-label">Customers</span>
        </a>

        <a href="#" class="admin-nav-item" data-admin-route="shop">
            <span class="admin-nav-icon">🏪</span>
            <span class="admin-nav-label">Shop</span>
        </a>

    </nav>

    <div class="admin-sidebar-shop" id="admin-sidebar-shop">
        <span class="admin-shop-label">Shop Status</span>

        <div class="admin-shop-row">
            <span
                class="admin-shop-status-text"
                id="admin-shop-status-text"
            >
                LOADING
            </span>

            <div
                class="admin-shop-switch"
                id="admin-shop-switch"
                role="switch"
                aria-checked="false"
                tabindex="0"
            >
                <div class="admin-shop-switch-knob"></div>
            </div>
        </div>
    </div>

</aside>

<!-- Main Content -->
<main class="admin-main">

    <header class="admin-topbar">

        <div class="admin-topbar-title">
            <h2 id="admin-page-title">Dashboard</h2>
            <p id="admin-page-subtitle">Welcome to RYVO Admin</p>
        </div>

        <div class="admin-topbar-actions">

            <a
                href="/pages/home.html"
                target="_blank"
                rel="noopener noreferrer"
                class="admin-topbar-button admin-topbar-view"
            >
                🏠 View Site
            </a>

            <button
                type="button"
                id="admin-logout-button"
                class="admin-topbar-button admin-topbar-logout"
            >
                🚪 Logout
            </button>

        </div>

    </header>

    <div class="admin-content" id="admin-content">
        <p class="admin-loading">Loading...</p>
    </div>

</main>

<!-- Scripts -->
<script src="/admin/js/order-admin-api.js?v=2"></script>
<script src="/admin/js/delivery-admin-api.js?v=2"></script>
<script src="/admin/js/payment-admin-api.js?v=2"></script>
<script src="/admin/js/food-admin-api.js?v=2"></script>
<script src="/admin/js/category-admin-api.js?v=2"></script>
<script src="/admin/js/customer-admin-api.js?v=2"></script>
<script src="/admin/js/shop-admin-api.js?v=2"></script>

<script src="/admin/js/order-dashboard.js?v=3"></script>
<script src="/admin/js/payment-dashboard.js?v=2"></script>
<script src="/admin/js/delivery-dashboard.js?v=2"></script>
<script src="/admin/js/food-dashboard.js?v=2"></script>
<script src="/admin/js/category-dashboard.js?v=2"></script>
<script src="/admin/js/customer-dashboard.js?v=2"></script>
<script src="/admin/js/shop-dashboard.js?v=2"></script>

<script src="/admin/js/admin-router.js?v=2"></script>
<script src="/admin/js/admin-badges.js?v=2"></script>
<script src="/admin/js/admin-shop-toggle.js?v=2"></script>

<script id="admin-auth-script">
document.addEventListener("DOMContentLoaded", async () => {
    const logoutButton = document.getElementById("admin-logout-button");

    try {
        const sessionResponse = await fetch(
            "http://localhost:5000/api/auth/admin/session",
            {
                method: "GET",
                credentials: "include"
            }
        );

        if (sessionResponse.ok === false) {
            window.location.href = "/admin/login.html";
            return;
        }

        const sessionResult = await sessionResponse.json();

        if (sessionResult.success === false) {
            window.location.href = "/admin/login.html";
            return;
        }
    } catch (error) {
        console.error("Admin session check failed:", error);
        window.location.href = "/admin/login.html";
        return;
    }

    if (logoutButton) {
        logoutButton.addEventListener("click", async () => {
            const confirmed = window.confirm(
                "Are you sure you want to logout?"
            );

            if (confirmed === false) return;

            logoutButton.disabled = true;
            logoutButton.textContent = "Logging out...";

            try {
                await fetch(
                    "http://localhost:5000/api/auth/admin/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );
            } catch (error) {
                console.error("Logout request failed:", error);
            }

            window.location.href = "/admin/login.html";
        });
    }
});
</script>

</body>
</html>
