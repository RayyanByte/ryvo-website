<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYVO Admin Login</title>
    <link rel="stylesheet" href="/admin/css/admin-login.css">
</head>

<body>

<main class="admin-login-page">
    <section class="admin-login-card">
        <div class="admin-login-header">
            <h1>RYVO Admin</h1>
            <p>Restaurant Management</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin-email">Email</label>
                <input
                    type="email"
                    id="admin-email"
                    name="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input
                    type="password"
                    id="admin-password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="admin-login-error" class="login-error" hidden></p>

            <button type="submit" id="admin-login-button">
                Login
            </button>
        </form>
    </section>
</main>

<script src="/admin/js/admin-login.js?v=1"></script>
</body>
</html>
