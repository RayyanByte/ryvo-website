<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/profile.css"
    >

    <link
        rel="stylesheet"
        href="../css/addresses.css"
    >

    <link
        rel="stylesheet"
        href="../css/address-form.css"
    >

    <link
        rel="stylesheet"
        href="../css/orders.css"
    >
</head>

<body>
    <main class="customer-dashboard">
        <header class="dashboard-header">
            <div>
                <p class="dashboard-eyebrow">
                    Customer Area
                </p>

                <h1>
                    Customer Dashboard
                </h1>

                <p class="dashboard-subtitle">
                    Manage your profile, addresses and orders.
                </p>
            </div>
        </header>

        <section
            class="dashboard-content"
            aria-label="Customer dashboard"
        >
            <div id="profile-section" data-customer-profile></div>

            <div id="addresses-section" data-customer-addresses></div>

            <div id="orders-section" data-customer-orders></div>
        </section>
    </main>

    <script
        src="../js/profile.js"
    ></script>

    <script
        src="../js/addresses.js"
    ></script>

    <script
        src="../js/address-form.js"
    ></script>

    <script
        src="../js/orders.js"
    ></script>

    <script>
        function showCustomerSection() {
            const sections = {
                profile: document.getElementById("profile-section"),
                orders: document.getElementById("orders-section"),
                addresses: document.getElementById("addresses-section")
            };

            const content = {
                profile: {
                    title: "My Profile",
                    subtitle: "Manage your personal information."
                },
                orders: {
                    title: "My Orders",
                    subtitle: "View your orders and their current status."
                },
                addresses: {
                    title: "Saved Addresses",
                    subtitle: "Manage the addresses used for your deliveries."
                }
            };

            const params = new URLSearchParams(window.location.search);

            let section =
                params.get("section") ||
                window.location.hash.replace("#", "");

            if (!sections[section]) {
                section = "profile";
            }

            Object.entries(sections).forEach(([name, element]) => {
                if (element) {
                    element.hidden = name !== section;
                }
            });

            const title = document.querySelector(".dashboard-header h1");
            const subtitle = document.querySelector(".dashboard-subtitle");

            if (title) {
                title.textContent = content[section].title;
            }

            if (subtitle) {
                subtitle.textContent = content[section].subtitle;
            }
        }

        window.addEventListener("hashchange", showCustomerSection);
        showCustomerSection();
    </script>
</body>
</html>
