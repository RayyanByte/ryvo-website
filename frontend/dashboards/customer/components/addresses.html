<section
    class="customer-addresses"
    aria-labelledby="customer-addresses-title"
>
    <div class="addresses-header">
        <div>
            <p class="addresses-eyebrow">
                Delivery
            </p>

            <h2 id="customer-addresses-title">
                Saved Addresses
            </h2>

            <p class="addresses-description">
                Manage the addresses used for your food deliveries.
            </p>
        </div>

        <button
            type="button"
            class="address-add-button"
            id="add-address-button"
        >
            Add Address
        </button>
    </div>

    <div
        class="addresses-list"
        id="addresses-list"
    >
        <p class="addresses-empty">
            No saved addresses yet.
        </p>
    </div>
</section>
