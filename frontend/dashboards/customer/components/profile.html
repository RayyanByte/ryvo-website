<section
    class="customer-profile"
    aria-labelledby="customer-profile-title"
>
    <div class="profile-header">
        <p class="profile-eyebrow">
            Account
        </p>

        <h2 id="customer-profile-title">
            My Profile
        </h2>

        <p class="profile-description">
            View and manage your customer account information.
        </p>
    </div>

    <div class="profile-details">
        <div class="profile-detail">
            <span class="profile-label">Name</span>
            <strong id="profile-name">Loading...</strong>
        </div>

        <div class="profile-detail">
            <span class="profile-label">Email</span>
            <strong id="profile-email">Loading...</strong>
        </div>

        <div class="profile-detail">
            <span class="profile-label">Phone</span>
            <strong id="profile-phone">Not added</strong>
        </div>
    </div>
</section>
