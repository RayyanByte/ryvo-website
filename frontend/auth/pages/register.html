<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<main class="auth-page">
<section class="login-card">
<div class="login-header">
<p class="login-eyebrow">Account</p>
<h1>Create Account</h1>
<p class="login-description">Create your RYVO account to place orders.</p>
</div>
<form class="login-form" id="register-form">
<div class="form-field"><label for="register-name">Name</label><input type="text" id="register-name" name="name" autocomplete="name" required></div>
<div class="form-field"><label for="register-email">Email</label><input type="email" id="register-email" name="email" autocomplete="email" required></div>
<div class="form-field"><label for="register-phone">Phone</label><input type="tel" id="register-phone" name="phone" autocomplete="tel"></div>
<div class="form-field"><label for="register-password">Password</label><input type="password" id="register-password" name="password" minlength="6" autocomplete="new-password" required></div>
<div class="form-field"><label for="register-confirm-password">Confirm Password</label><input type="password" id="register-confirm-password" name="confirmPassword" minlength="6" autocomplete="new-password" required></div>
<button type="submit" class="login-button">Create Account</button>
<p class="login-message" id="register-message" aria-live="polite"></p>
<p class="auth-switch">Already have an account? <a href="/auth/pages/login.html">Sign In</a></p>
</form>
</section>
</main>
<script src="../js/register.js"></script>
</body>
</html>
