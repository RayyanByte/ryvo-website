<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu | RYVO</title>

    <link
        rel="stylesheet"
        href="../css/menu.css"
    >

    <link
        rel="stylesheet"
        href="../../order/css/order-button.css"
    >
</head>

<body>

    <main class="food-menu-page">

        <header class="food-menu-header">
            <p class="food-menu-eyebrow">
                Our Menu
            </p>

            <h1>
                Discover Our Food
            </h1>

            <p class="food-menu-description">
                Explore freshly prepared dishes and choose
                what you would like to order.
            </p>
        </header>

        <section
            class="food-menu-categories"
            aria-labelledby="food-menu-categories-title"
        >
            <h2 id="food-menu-categories-title">
                Categories
            </h2>

            <div
                id="food-category-list"
                class="food-category-list"
            >
                <p class="food-menu-loading">
                    Loading categories...
                </p>
            </div>
        </section>

        <section
            class="food-menu-list-section"
            aria-labelledby="food-menu-list-title"
        >
            <div class="food-menu-list-header">
                <div>
                    <p class="food-menu-eyebrow">
                        Food
                    </p>

                    <h2 id="food-menu-list-title">
                        All Dishes
                    </h2>
                </div>
            </div>

            <div
                id="food-list"
                class="food-list"
            >
                <p class="food-menu-loading">
                    Loading food...
                </p>
            </div>
        </section>

    </main>

    <script src="../../order/js/order-button.js"></script>
    <script src="../js/menu.js"></script>

</body>
</html>
